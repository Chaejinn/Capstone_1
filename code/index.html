<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drown Guardian · 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="platform-body">

  <div class="platform-brand"><div class="dot"></div>Drown Guardian <small>PLATFORM</small></div>

  <div class="login-card">
    <div class="login-eyebrow">관제 플랫폼 로그인</div>
    <div class="login-title">환영합니다</div>
    <div class="login-sub">인명 감지·자율 구조 파이프라인을 관리하려면 운영자 계정으로 로그인하세요.</div>

    <div class="login-error" id="loginError">아이디 또는 비밀번호가 올바르지 않거나 비활성화된 계정입니다.</div>

    <div class="field-group">
      <label>아이디</label>
      <input type="text" id="loginId" placeholder="아이디를 입력하세요" autocomplete="username">
    </div>
    <div class="field-group">
      <label>비밀번호</label>
      <input type="password" id="loginPw" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn">로그인</button>

    <div class="login-foot">
      <span>계정이 없으신가요?</span>
      <a href="signup.html">회원가입 →</a>
    </div>
    <div class="login-foot">
      <a href="admin-login.html">🛡 관리자이신가요? 관리자 로그인 →</a>
    </div>

    <div class="demo-hint">
      운영자 계정은 관리자 패널에서 발급·비활성화·삭제할 수 있습니다.<br>
      계정이 없다면 담당 관리자에게 발급을 요청하세요.
    </div>
  </div>

<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
