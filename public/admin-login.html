<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drown Guardian · 관리자 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="platform-body admin-mode">

  <div class="platform-brand admin"><div class="dot"></div>Drown Guardian <small>ADMIN ACCESS</small></div>

  <div class="login-card admin-theme">
    <div class="login-eyebrow">🛡 관리자 전용 로그인</div>
    <div class="login-title">시스템 관리자 인증</div>
    <div class="login-sub">이 구역은 관리자 전용 영역입니다. 일반 운영자 계정으로는 접근할 수 없습니다.</div>

    <div class="login-error" id="loginError">관리자 아이디 또는 비밀번호가 올바르지 않습니다.</div>

    <div class="field-group">
      <label>관리자 아이디</label>
      <input type="text" id="loginId" placeholder="root" autocomplete="username">
    </div>
    <div class="field-group">
      <label>관리자 비밀번호</label>
      <input type="password" id="loginPw" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn admin-btn" id="loginBtn">관리자 로그인</button>

    <div class="login-foot">
      <a href="index.html">← 운영자 로그인으로 돌아가기</a>
    </div>

    <div class="demo-hint">
      모든 로그인 시도(성공·실패)는 감사 로그에 기록되며, 이 페이지는 일반 로그인 화면에 노출되지 않습니다.
    </div>
  </div>

<script src="js/auth.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
